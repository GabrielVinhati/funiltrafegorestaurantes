<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CZ Mídia — Destravar Vendas</title>
    <meta name="description" content="Formulário estratégico da CZ Mídia. Preencha e receba um plano realista de crescimento com tráfego pago para sua empresa." />
    <link rel="icon" href="img/image.png" type="image/png" sizes="192x192" />
    <link rel="shortcut icon" href="img/image.png" type="image/png" />
    <link rel="apple-touch-icon" href="img/image.png" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                bg: "#0D0D0D",
                surface: "#141414",
                surface2: "#1A1A1A",
                blue: "#37A0EE",
                blue2: "#2B8FE0",
                white: "#F7F7F7",
                muted: "#5B6F7D",
                line: "rgba(255,255,255,.10)",
              },
            },
            boxShadow: {
              glow: "0 0 0 1px rgba(55,160,238,.30), 0 16px 48px rgba(0,0,0,.60)",
            },
            keyframes: {
              enter: {
                "0%": { opacity: "0", transform: "translateY(12px) scale(.985)" },
                "100%": { opacity: "1", transform: "translateY(0) scale(1)" },
              },
              exit: {
                "0%": { opacity: "1", transform: "translateY(0) scale(1)" },
                "100%": { opacity: "0", transform: "translateY(-8px) scale(.985)" },
              },
              shake: {
                "0%,100%": { transform: "translateX(0)" },
                "20%": { transform: "translateX(-6px)" },
                "40%": { transform: "translateX(6px)" },
                "60%": { transform: "translateX(-4px)" },
                "80%": { transform: "translateX(4px)" },
              },
              pulseSoft: {
                "0%,100%": { opacity: ".35" },
                "50%": { opacity: ".80" },
              },
              floatUp: {
                "0%,100%": { transform: "translateY(0px)" },
                "50%": { transform: "translateY(-8px)" },
              },
            },
            animation: {
              enter: "enter .35s ease-out both",
              exit: "exit .22s ease-in both",
              shake: "shake .28s ease-in-out",
              pulseSoft: "pulseSoft 3s ease-in-out infinite",
              floatUp: "floatUp 4s ease-in-out infinite",
            },
          },
        },
      };
    </script>

    <style>
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      button, a { -webkit-tap-highlight-color: transparent; }
      input:-webkit-autofill,
      input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 1000px #1A1A1A inset;
        -webkit-text-fill-color: #F7F7F7;
        caret-color: #F7F7F7;
      }
    </style>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1220773276915671');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>

  <body class="min-h-screen bg-brand-bg text-brand-white">
    <noscript>
      <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1220773276915671&ev=PageView&noscript=1"/>
    </noscript>

    <!-- BG Decor -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div class="absolute inset-0 bg-[radial-gradient(60%_45%_at_50%_15%,rgba(55,160,238,.18)_0%,rgba(13,13,13,0)_65%)]"></div>
      <div class="absolute -top-32 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-brand-blue/8 blur-3xl animate-pulseSoft"></div>
      <div class="absolute top-1/2 -left-24 h-64 w-64 rounded-full bg-brand-blue/5 blur-3xl animate-floatUp"></div>
      <div class="absolute -bottom-20 right-[-40px] h-64 w-64 rounded-full bg-brand-blue/7 blur-3xl"></div>
    </div>

    <main class="relative mx-auto flex min-h-screen max-w-[540px] flex-col px-4 pb-12 pt-6">

      <!-- Header -->
      <header class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="grid h-11 w-11 place-items-center rounded-2xl bg-brand-blue/15 ring-1 ring-brand-line shadow-glow overflow-hidden">
            <img
              src="img/image.png"
              alt="CZ Mídia"
              class="h-full w-full object-contain scale-[1.8]"
              loading="eager"
              decoding="async"
            />
          </div>
          <div class="leading-tight">
            <p class="text-sm font-semibold tracking-wide">
              <span class="text-brand-white">CZ</span><span class="text-brand-blue"> Mídia</span>
            </p>
            <p class="text-xs text-brand-white/60">Tráfego Pago Estratégico</p>
          </div>
        </div>
        <button
          id="btnRestartTop"
          class="hidden rounded-full px-3 py-2 text-xs font-semibold text-brand-white/70 ring-1 ring-brand-line hover:bg-white/5 active:scale-[.98] transition"
          type="button"
        >Reiniciar</button>
      </header>

      <!-- Progress -->
      <section class="mb-5">
        <div class="flex items-center justify-between text-xs mb-2">
          <p id="progressLabel" class="text-brand-white/65 font-medium">Pronto para começar!</p>
          <p id="stepsHint" class="text-brand-white/50">⏱ menos de 2 min</p>
        </div>
        <div class="h-1.5 w-full overflow-hidden rounded-full bg-white/5 ring-1 ring-brand-line">
          <div id="progressBar" class="h-full w-[0%] rounded-full bg-gradient-to-r from-brand-blue to-sky-400 transition-[width] duration-500 ease-out"></div>
        </div>
      </section>

      <!-- Card Container -->
      <section class="flex-1">
        <div id="card" class="rounded-3xl bg-brand-surface/90 p-6 ring-1 ring-brand-line shadow-glow backdrop-blur-md">
          <!-- step content rendered here -->
        </div>
        <div class="mt-4 flex items-center justify-between">
          <button
            id="btnBack"
            class="invisible rounded-xl px-3 py-2 text-sm font-semibold text-brand-white/70 ring-1 ring-brand-line hover:bg-white/5 active:scale-[.98] transition"
            type="button"
          >← Voltar</button>
          <p class="text-xs text-brand-white/40">Suas respostas são confidenciais 🔒</p>
        </div>
      </section>

      <footer class="mt-10 text-center text-xs text-brand-white/35">
        © <span id="year"></span> CZ Mídia • Tráfego pago estratégico
      </footer>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const WHATS_NUMBER = "5527995029973";

      const steps = [
        { id: "intro",      type: "intro" },
        {
          id: "nome",       type: "text",
          question: "Qual seu nome?",
          placeholder: "Digite seu nome completo",
          inputType: "text", inputMode: "text",
          key: "nome",
          validate: (v) => v.trim().length >= 2 ? null : "Por favor, informe seu nome.",
          next: () => "whatsapp",
        },
        {
          id: "whatsapp",   type: "text",
          question: "Qual é seu número de WhatsApp?",
          placeholder: "(XX) 9 XXXX-XXXX",
          inputType: "tel", inputMode: "tel",
          key: "whatsapp",
          validate: (v) => v.replace(/\D/g,"").length >= 10 ? null : "Informe um número de WhatsApp válido.",
          next: () => "instagram",
        },
        {
          id: "instagram",  type: "text",
          question: "Qual é o @ do Instagram da sua empresa?",
          placeholder: "@suaempresa",
          inputType: "text", inputMode: "text",
          key: "instagram",
          validate: (v) => v.trim().length >= 2 ? null : "Informe o @ do Instagram.",
          next: () => "faturamento",
        },
        {
          id: "faturamento", type: "choice",
          question: "Qual é o faturamento mensal da sua empresa?",
          options: [
            "R$0 a R$5.000",
            "R$5.000 a R$10.000",
            "R$10.000 a R$20.000",
            "R$20.000 a R$50.000",
            "Acima de R$100.000",
          ],
          key: "faturamento",
          next: () => "email",
        },
        {
          id: "email",      type: "text",
          question: "Qual é o seu melhor email?",
          placeholder: "seu@email.com",
          inputType: "email", inputMode: "email",
          key: "email",
          validate: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? null : "Informe um e-mail válido.",
          next: () => "site",
        },
        {
          id: "site",       type: "text",
          question: "Qual é o site da sua empresa?",
          placeholder: "www.suaempresa.com.br",
          inputType: "text", inputMode: "url",
          key: "site",
          optional: true,
          validate: () => null,
          next: () => "result",
        },
        { id: "result", type: "result" },
      ];

      const state = { answers: {}, history: [], currentId: "intro" };

      function getStep(id) { return steps.find(s => s.id === id); }
      function computeNext(step, val) {
        if (typeof step.next === "function") return step.next(val);
        if (typeof step.next === "string") return step.next;
        return null;
      }

      function esc(str) {
        return String(str).replace(/[&<>"']/g,
          m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
      }

      function makeWhatsAppUrl() {
        const a = state.answers;
        const msg =
          "Olá! Vim pelo formulário da CZ Mídia.\n\n" +
          "Minhas informações:\n" +
          (a.nome       ? "• Nome: "        + a.nome        + "\n" : "") +
          (a.whatsapp   ? "• WhatsApp: "    + a.whatsapp    + "\n" : "") +
          (a.instagram  ? "• Instagram: "   + a.instagram   + "\n" : "") +
          (a.faturamento? "• Faturamento: " + a.faturamento + "\n" : "") +
          (a.email      ? "• Email: "       + a.email       + "\n" : "") +
          (a.site       ? "• Site: "        + a.site        + "\n" : "") +
          "\nGostaria de saber mais sobre o plano de crescimento.";
        return "https://wa.me/" + WHATS_NUMBER + "?text=" + encodeURIComponent(msg);
      }

      async function setCardHtml(html) {
        const card = $("card");
        card.classList.remove("animate-enter","animate-exit","animate-shake");
        card.classList.add("animate-exit");
        await sleep(150);
        card.innerHTML = html;
        card.classList.remove("animate-exit");
        card.classList.add("animate-enter");
      }

      const INPUT_STEPS = ["nome","whatsapp","instagram","faturamento","email","site"];
      const TOTAL = INPUT_STEPS.length;

      function updateProgress() {
        const idx = INPUT_STEPS.indexOf(state.currentId);
        const pct = state.currentId === "intro"
          ? 0
          : state.currentId === "result"
            ? 100
            : Math.round(((idx) / TOTAL) * 100);

        $("progressLabel").textContent =
          state.currentId === "intro"   ? "Pronto para começar!" :
          state.currentId === "result"  ? "Concluído 🎉"         :
          "Progresso: " + pct + "%";

        $("progressBar").style.width = pct + "%";
        $("btnBack").classList.toggle("invisible", state.history.length === 0);
        $("btnRestartTop").classList.toggle("hidden", state.currentId === "intro");
      }

      function stepCounter() {
        const idx = INPUT_STEPS.indexOf(state.currentId);
        if (idx < 0) return "";
        return '<p class="mb-3 text-xs font-semibold text-brand-blue/80 uppercase tracking-widest">Pergunta ' + (idx+1) + ' de ' + TOTAL + '</p>';
      }

      function primaryBtn(label, attrs) {
        return '<button type="button" class="w-full rounded-2xl bg-brand-blue px-4 py-3.5 text-sm font-extrabold text-brand-bg shadow-glow hover:bg-brand-blue2 active:scale-[.99] transition-all" ' + (attrs||"") + '>' + esc(label) + '</button>';
      }

      function optionBtn(label, idx) {
        const letters = ["A","B","C","D","E"];
        return '<button type="button" data-opt="' + esc(label) + '" class="group w-full rounded-2xl bg-brand-surface2/80 px-4 py-3.5 text-left text-sm font-semibold text-brand-white ring-1 ring-brand-line hover:ring-brand-blue/50 hover:bg-white/5 active:scale-[.99] transition-all"><div class="flex items-center gap-3"><span class="grid h-7 w-7 shrink-0 place-items-center rounded-xl bg-white/5 text-xs font-extrabold text-brand-white/60 ring-1 ring-brand-line group-hover:bg-brand-blue/15 group-hover:text-brand-blue group-hover:ring-brand-blue/40 transition-all">' + (letters[idx]||idx+1) + '</span><span class="leading-snug">' + esc(label) + '</span></div></button>';
      }

      function textInput(step, value) {
        return '<input id="stepInput" type="' + step.inputType + '" inputmode="' + step.inputMode + '" value="' + esc(value) + '" placeholder="' + esc(step.placeholder) + '" class="mt-4 w-full rounded-2xl bg-brand-surface2/80 px-4 py-3.5 text-base font-semibold text-brand-white placeholder:text-brand-white/35 ring-1 ring-brand-line focus:outline-none focus:ring-2 focus:ring-brand-blue transition-all" autocomplete="off" />';
      }

      async function renderStep(id) {
        state.currentId = id;
        updateProgress();
        const step = getStep(id);
        if (!step) return;

        // INTRO
        if (step.type === "intro") {
          const html =
            '<div class="text-center">' +
            '<div class="mb-5 inline-flex items-center justify-center rounded-2xl bg-brand-blue/15 p-4 ring-1 ring-brand-blue/30 shadow-glow"><span class="text-4xl">🚀</span></div>' +
            '<h1 class="text-2xl font-extrabold tracking-tight leading-snug">Falta pouco para destravar<br>as vendas da sua empresa!</h1>' +
            '<p class="mt-4 text-sm leading-relaxed text-brand-white/70">Esse formulário nos ajuda a entender o cenário do seu negócio, pra que possamos te apresentar um <span class="font-bold text-brand-white">plano realista e eficiente</span> de crescimento com tráfego pago.</p>' +
            '<div class="mt-4 inline-flex items-center gap-2 rounded-full bg-white/5 px-4 py-2 ring-1 ring-brand-line text-xs text-brand-white/70 font-semibold"><span>⏱</span><span>Leva menos de 2 minutos.</span></div>' +
            '<div class="mt-6 grid gap-3">' + primaryBtn("Começar agora →", 'id="btnStart"') + '</div>' +
            '<p class="mt-4 text-xs text-brand-white/40">🔒 Suas informações são 100% seguras e confidenciais.</p>' +
            '</div>';
          await setCardHtml(html);
          $("btnStart").addEventListener("click", () => goNext(step, null, "nome"));
          return;
        }

        // TEXT
        if (step.type === "text") {
          const current = state.answers[step.key] || "";
          const html =
            stepCounter() +
            '<h2 class="text-xl font-extrabold leading-snug">' + esc(step.question) + '</h2>' +
            textInput(step, current) +
            (step.optional ? '<p class="mt-2 text-xs text-brand-white/40">Campo opcional — pode deixar em branco.</p>' : "") +
            '<div class="mt-5 grid gap-3">' + primaryBtn("Continuar →", 'id="btnContinue"') + '</div>';
          await setCardHtml(html);
          const input = $("stepInput");
          input.focus();
          $("btnContinue").addEventListener("click", () => {
            const val = input.value;
            const err = step.validate ? step.validate(val) : null;
            if (err) return shakeCard(err);
            goNext(step, val.trim());
          });
          input.addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnContinue").click(); });
          return;
        }

        // CHOICE
        if (step.type === "choice") {
          const html =
            stepCounter() +
            '<h2 class="text-xl font-extrabold leading-snug">' + esc(step.question) + '</h2>' +
            '<div class="mt-5 grid gap-2">' +
            step.options.map((o,i) => optionBtn(o,i)).join("") +
            '</div>';
          await setCardHtml(html);
          $("card").querySelectorAll("[data-opt]").forEach(btn => {
            btn.addEventListener("click", async () => {
              const val = btn.getAttribute("data-opt");
              btn.classList.add("ring-2","ring-brand-blue","bg-brand-blue/10");
              await sleep(150);
              goNext(step, val);
            });
          });
          return;
        }

        // RESULT
        if (step.type === "result") {
          await renderResult();
          return;
        }
      }

      async function renderResult() {
        const waUrl = makeWhatsAppUrl();
        const a = state.answers;
        const firstName = a.nome ? ", " + a.nome.split(" ")[0] : "";

        function row(icon, val) {
          if (!val) return "";
          return '<div class="flex items-center gap-2 text-sm"><span class="text-brand-blue">' + icon + '</span><span class="text-brand-white/80">' + esc(val) + '</span></div>';
        }

        const html =
          '<div class="text-center">' +
          '<div class="mb-5 inline-flex items-center justify-center rounded-2xl bg-green-500/15 p-4 ring-1 ring-green-500/30"><span class="text-4xl">🎉</span></div>' +
          '<h1 class="text-2xl font-extrabold tracking-tight">Obrigado por responder' + esc(firstName) + '!</h1>' +
          '<p class="mt-3 text-sm leading-relaxed text-brand-white/70">Em breve nossa equipe entrará em contato.</p>' +
          '<div class="mt-5 rounded-2xl bg-white/5 p-4 ring-1 ring-brand-line text-left">' +
          '<p class="text-xs font-semibold text-brand-white/50 uppercase tracking-wider mb-3">Suas respostas</p>' +
          '<div class="grid gap-2">' +
          row("👤", a.nome) +
          row("📱", a.whatsapp) +
          row("📸", a.instagram) +
          row("💰", a.faturamento) +
          row("✉️", a.email) +
          row("🌐", a.site) +
          '</div></div>' +
          '<div class="mt-5 grid gap-3">' +
          '<a href="' + waUrl + '" id="btnWhatsResult" class="flex items-center justify-center gap-2 w-full rounded-2xl bg-green-600 px-4 py-4 text-sm font-extrabold text-white shadow-lg hover:bg-green-500 active:scale-[.99] transition-all" target="_blank" rel="noopener">' +
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
          'Falar com nossa equipe agora no WhatsApp' +
          '</a>' +
          '<button id="btnRestart" type="button" class="w-full rounded-2xl bg-white/5 px-4 py-3 text-sm font-semibold text-brand-white/70 ring-1 ring-brand-line hover:bg-white/10 active:scale-[.99] transition-all">Reiniciar formulário</button>' +
          '</div></div>';

        await setCardHtml(html);

        // Envio silencioso para email via FormSubmit AJAX (não altera a tela)
        fetch("https://formsubmit.co/ajax/cliffordztn@gmail.com", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            _subject: "Novo lead — Formulário CZ Mídia",
            Nome: a.nome || "",
            WhatsApp: a.whatsapp || "",
            Instagram: a.instagram || "",
            Faturamento: a.faturamento || "",
            Email: a.email || "",
            Site: a.site || "",
            _template: "table"
          })
        }).catch(() => {}); // falha silenciosa — não impacta o usuário

        if (typeof fbq !== "undefined") {
          fbq("track", "Lead", { content_name: "Formulário CZ Mídia" });
        }

        $("btnRestart").addEventListener("click", restart);
      }

      async function shakeCard(msg) {
        const card = $("card");
        card.classList.remove("animate-shake");
        void card.offsetWidth;
        card.classList.add("animate-shake");
        const existing = card.querySelector(".error-toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.className = "error-toast mt-4 rounded-2xl bg-red-500/10 px-4 py-3 text-sm font-semibold text-red-400 ring-1 ring-red-500/30";
        toast.textContent = msg;
        card.appendChild(toast);
        setTimeout(() => toast.remove(), 2600);
      }

      function goNext(step, value, forcedNextId) {
        if (step && step.key) state.answers[step.key] = value;
        const nextId = forcedNextId != null ? forcedNextId : computeNext(step, value);
        if (!nextId) return;
        state.history.push(step ? step.id : "intro");
        renderStep(nextId);
      }

      function goBack() {
        if (!state.history.length) return;
        renderStep(state.history.pop());
      }

      function restart() {
        state.answers = {};
        state.history = [];
        state.currentId = "intro";
        renderStep("intro");
      }

      $("btnBack").addEventListener("click", goBack);
      $("btnRestartTop").addEventListener("click", restart);
      $("year").textContent = new Date().getFullYear();
      renderStep("intro");
    </script>
  </body>
</html>
